name: fetch-asset
on:
  push:
    paths: ["assets/fetch.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p assets
          while read -r url dest; do
            [ -z "$url" ] && continue
            curl -fsSL -A "BrandWithAKBot/1.0 (https://www.instagram.com/brandwithak/)" "$url" -o "assets/$dest"
          done < assets/fetch.txt
      - run: |
          pip install pillow numpy
          python3 - <<'PYEOF'
          import glob
          import numpy as np
          from PIL import Image
          for f in glob.glob('assets/*_magenta.png'):
              im = np.asarray(Image.open(f).convert('RGB')).astype(float)
              r, g, b = im[..., 0], im[..., 1], im[..., 2]
              spill = np.minimum(r, b) - g
              m = np.clip((spill - 30) / 190.0, 0, 1)
              ex = np.clip(spill, 0, None) * np.clip(m * 1.5, 0, 1)
              r = np.clip(r - ex, 0, 255)
              b = np.clip(b - ex, 0, 255)
              a = (1 - m) * 255
              out = np.dstack([r, g, b, a]).astype(np.uint8)
              Image.fromarray(out, 'RGBA').save(f.replace('_magenta', ''))
          PYEOF
      - run: |
          git config user.name "brandwithak-bot"
          git config user.email "bot@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "fetch assets" && git push)
