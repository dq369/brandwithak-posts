name: fetch-asset
on:
  push:
    paths: ["assets/fetch.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p assets
          while read -r url dest; do
            [ -z "$url" ] && continue
            curl -fsSL -A "BrandWithAKBot/1.0 (https://www.instagram.com/brandwithak/)" "$url" -o "assets/$dest"
          done < assets/fetch.txt
      - run: |
          pip install pillow numpy
          python3 - <<'PYEOF'
          import glob
          import numpy as np
          from PIL import Image, ImageFilter
          for f in glob.glob('assets/*_magenta.png'):
              im = np.asarray(Image.open(f).convert('RGB')).astype(float)
              r, g, b = im[..., 0], im[..., 1], im[..., 2]
              spill = np.minimum(r, b) - g
              m = np.clip((spill - 8) / 120.0, 0, 1)
              a = 1 - m
              ex = np.clip(spill, 0, None)
              r = np.clip(r - ex, 0, 255)
              b = np.clip(b - ex, 0, 255)
              A = Image.fromarray((a * 255).astype(np.uint8), 'L').filter(ImageFilter.MinFilter(3))
              res = Image.fromarray(np.dstack([r, g, b]).astype(np.uint8), 'RGB').convert('RGBA')
              res.putalpha(A)
              res.save(f.replace('_magenta', ''))
          PYEOF
      - run: |
          pip install pillow cairosvg
          python3 - <<'PYEOF'
          import glob, os
          from PIL import Image
          import cairosvg
          for f in glob.glob('assets/*_src.*'):
              base = os.path.basename(f).split('_src.')[0]
              out = 'assets/logo_%s.png' % base
              if f.endswith('.svg'):
                  cairosvg.svg2png(url=f, write_to=out, output_width=900)
              else:
                  Image.open(f).convert('RGBA').save(out)
              im = Image.open(out).convert('RGBA')
              bb = im.getchannel('A').getbbox()
              if bb:
                  im = im.crop(bb)
              im.save(out)
              print(out, im.size)
          PYEOF
      - run: |
          git config user.name "brandwithak-bot"
          git config user.email "bot@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "fetch assets" && git push)
