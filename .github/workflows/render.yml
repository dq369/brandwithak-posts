name: render
on:
  push:
    paths: ["slides/**", "render.mjs"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node render.mjs
      - run: |
          git config user.name "brandwithak-bot"
          git config user.email "bot@users.noreply.github.com"
          git add images
          git diff --cached --quiet || (git commit -m "render images" && git push)
